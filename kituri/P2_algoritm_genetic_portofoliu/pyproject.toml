[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sada-p2-portofoliu"
version = "0.1.0"
description = "Proiect SADA: algoritm genetic pentru un portofoliu de intervenții, cu condiții care se schimbă"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
