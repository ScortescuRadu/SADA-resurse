# Rulează testele la fiecare push pe GitHub (Actions). Opțional, dar util:
# vedeți imediat dacă ceva merge doar pe calculatorul vostru.
name: teste
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt && pip install -e .
      - run: pytest -q
